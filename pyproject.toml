[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-firewall"
version = "0.9.0"
description = "Security and authorization layer for AI agents and automated tool use."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "PyYAML>=6.0",
    "mcp>=2.0",
    "cryptography>=41.0",
]

[project.scripts]
firewall = "firewall.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
include = ["firewall*"]