[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-firewall"
version = "0.9.0"
description = "Security and authorization layer for AI agents and automated tool use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
]

[project.scripts]
firewall = "firewall.cli:main"

[tool.setuptools.packages.find]
include = ["firewall*"]