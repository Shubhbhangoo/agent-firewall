name: Security CI

on:
  push:
    branches:
      - main
      - master
      - v0.9
      - v1.0
      - v1.1
      - v1.2
      - v1.3
      - v1.4
      - v1.5
      - v1.6
      - v1.6.1-ui
      - v1.7
      - v1.8
      - v1.9
      - v2.0
      - v2.1
      - v2.1.1
      - v2.2
      - v2.3
      - v2.4

  pull_request:
    branches:
      - main
      - master
      - v0.9
      - v1.0
      - v1.1
      - v1.2
      - v1.3
      - v1.4
      - v1.5
      - v1.6
      - v1.6.1-ui
      - v1.7
      - v1.8
      - v1.9
      - v2.0
      - v2.1
      - v2.1.1
      - v2.2
      - v2.3
      - v2.4

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full security regression
        run: python -m pytest -q

      # Structural half of the invariant suite: a subsystem that
      # constructs an authorization verdict, a new reader of the live
      # capability registry, or a second provenance vocabulary fails
      # here. No --strict: the seven state-dependent invariants have no
      # live state to read in this mode, so strict would report
      # unverifiable on every run and the gate would be ignored.
      - name: Check security invariants against the source tree
        run: python -m firewall.invariants

      # The other half, and the real gate. --exercise builds the
      # canonical estate (issued, delegated, attenuated, revoked, one
      # narrowing policy transformation, and one Aegis grant walked
      # through ISSUED -> NARROWED -> REVALIDATING -> ACTIVE with a real
      # narrowing and a real lift), so all fifteen invariants have the
      # state they are about and --strict can pass. Unverifiable is a
      # failure here: an invariant the estate stops reaching means the
      # gate has quietly narrowed, and exit 2 says so.
      - name: Gate all fifteen invariants on an exercised estate
        run: python -m firewall.invariants --exercise --strict
