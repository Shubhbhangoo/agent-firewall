name: Security CI

on:
  # `v*` rather than an enumerated list, for the reason spelled out in
  # cli.yml: the enumeration drifted five releases behind before anyone
  # noticed, and a branch filter that must be edited every release is one
  # that will eventually not be.
  push:
    branches:
      - main
      - master
      - "v*"

  pull_request:
    branches:
      - main
      - master
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      # The narrow gate: syntax errors, invalid format strings, and names
      # that are not defined in the scope reading them. A NameError raised
      # on an authorization path would violate FAIL_CLOSED, which requires
      # the boundary to deny rather than raise -- so this runs before the
      # suite rather than after it. The rule set is deliberately narrow;
      # widening it is a per-family decision, see [tool.ruff.lint].
      - name: Lint the package (crash-class rules)
        run: ruff check firewall/

      - name: Run full security regression
        run: python -m pytest -q

      # Structural half of the invariant suite: a subsystem that
      # constructs an authorization verdict, a new reader of the live
      # capability registry, or a second provenance vocabulary fails
      # here. No --strict: the seventeen state-dependent invariants have
      # no live state to read in this mode, so strict would report
      # unverifiable on every run and the gate would be ignored.
      - name: Check security invariants against the source tree
        run: python -m firewall.invariants

      # The other half, and the real gate. --exercise builds the
      # canonical estate (issued, delegated, attenuated, revoked, one
      # narrowing policy transformation, one Aegis grant walked
      # through ISSUED -> NARROWED -> REVALIDATING -> ACTIVE with a real
      # narrowing and a real lift, one execution walked to a clean
      # COMPLETED plus one revoked before it could finish, and one side
      # effect walked through prepare -> attempt -> receipt ->
      # verification -> attestation -> commit, with a registered external
      # issuer's signed statement, and one lineage anchored through a
      # witness and confirmed by a quorum of witnesses), so all
      # twenty-six invariants have the state they are about and --strict
      # can pass. Unverifiable is a failure here: an invariant the estate
      # stops reaching means the gate has quietly narrowed, and exit 2
      # says so.
      - name: Gate all twenty-six invariants on an exercised estate
        run: python -m firewall.invariants --exercise --strict
