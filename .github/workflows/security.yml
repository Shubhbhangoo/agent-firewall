name: Security CI

on:
  push:
    branches:
      - main
      - master
      - v0.9
      - v1.0
      - v1.1
      - v1.2
      - v1.3
      - v1.4
      - v1.5
      - v1.6

  pull_request:
    branches:
      - main
      - master
      - v0.9
      - v1.0
      - v1.1
      - v1.2
      - v1.3
      - v1.4
      - v1.5
      - v1.6

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full security regression
        run: python -m pytest -q
